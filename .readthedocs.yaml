# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      # Prevent a dirty git index that would change the version generated by setuptoosl_scm.
      # See https://docs.readthedocs.com/platform/stable/build-customization.html#avoid-having-a-dirty-git-index
      - git update-index --assume-unchanged docs/conf.py

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # Fail on all warnings to avoid broken references
  # fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
formats:
   - pdf
   - epub

python:
   install:
   # Make sure to install pyBacktrack itself from the current source code.
   - method: pip
     path: .
   # Optional but recommended, declare the Python requirements required to build your documentation
   # See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
   - requirements: docs/requirements.txt
